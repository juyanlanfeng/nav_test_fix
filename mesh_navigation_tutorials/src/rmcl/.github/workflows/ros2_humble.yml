name: ros2_humble

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:
    branches:
      - '*'

jobs:
  humble:
    name: ros2-humble
    uses: ./.github/workflows/ros2_template.yml
    with:
      docker_base_image: rostooling/setup-ros-docker:ubuntu-jammy-latest
      ros_distro: humble
