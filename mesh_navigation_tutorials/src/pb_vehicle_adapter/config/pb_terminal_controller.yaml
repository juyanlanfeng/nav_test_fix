# PB simulation terminal-control parameters (pb_terminal_controller).
#
# MBF 的 controllers 参数在 mbf_mesh_nav.yaml 中选择此插件；
# 此文件存放插件自身的详细参数，由 MBF 启动文件自动加载。
#
# Values were migrated verbatim from the previous in-tree configuration; the
# before/after ros2 param dumps are compared in
# log/p0_param_migration/pb_terminal_controller_{before,after}.json.
move_base_flex:
  ros__parameters:
    pb_terminal_controller:
      type: 'pb_terminal_controller/PbTerminalController'
      align_deadband: 0.02
      align_gain: 1.5
      align_radius: 0.12
      ang_vel_factor: 7.0
      arrival_fading: 0.5
      dwell_s: 1.0
      goal_search_radius: 0.4
      # Station keeping.  Zero command is not a hold on this force-based drive (T7
      # drifted 1.77 m with the wheels unpowered), so HOLD/FINISHED issue a bounded
      # closed-loop correction instead of a stop.
      hold_gain: 1.0
      hold_max_linear_velocity: 0.1
      hold_max_angular_velocity: 0.2
      # No-progress detection during TRACK only: commanded motion that produces none
      # means the robot is pushing against something it cannot overcome.  Stopping and
      # reporting beats burning the actuator for the framework's whole tolerance.
      stuck_command_threshold: 0.05
      stuck_progress_fraction: 0.25
      stuck_min_expected_m: 0.01
      stuck_timeout_s: 8.0
      recovery_dwell_s: 1.0
      health_topic: '/pb/truth_health'
      holonomic: false
      hysteresis: 0.05
      level_tolerance: 0.1
      lin_vel_factor: 1.0
      max_ang_velocity: 0.5
      max_angle: 20.0
      max_angular_acceleration: 1.0
      max_goal_height_error: 0.25
      max_lin_velocity: 1.0
      max_linear_acceleration: 0.5
      max_search_distance: 0.4
      max_search_radius: 0.4
      require_health: true
      settle_max_angular_velocity: 0.3
      settle_max_linear_velocity: 0.3
      settle_radius: 0.2
      yaw_hysteresis: 0.05
      yaw_tolerance: 0.1
