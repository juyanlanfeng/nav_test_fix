# PB 车辆仿真配置。导航、定位和地图参数位于 mesh_navigation_tutorials/config/mbf_mesh_nav.yaml。
# pb_vehicle 是配置容器名，不是 ROS 节点名；不要把整个文件直接当节点参数加载。
pb_vehicle:
  ros__parameters:
    # --- 仿真世界 ------------------------------------------------------------
    world_name: "rmuc2026_field"  # Gazebo 世界文件名（不含 .sdf）。

    # --- 仿真启动与显示 ------------------------------------------------------
    start_sim: "True"                 # 是否一并启动仿真；False 复用已运行的仿真。
    start_gazebo_gui: "True"          # 是否显示 Gazebo 图形界面。

    # --- PB 资源位置 ---------------------------------------------------------
    # 机器人模型资源目录。
    pb_robot_description_root: "/home/rainple/nav_test/third_party/pb2025_sources/pb2025_robot_description"
    # Gazebo 公共模型目录。
    pb_resources_root: "/home/rainple/nav_test/third_party/pb2025_sources/rmoss_gz_resources"
    # Gazebo 底盘与灯条插件目录。
    pb_plugin_path: "/home/rainple/nav_test/third_party/pb2025_install/rmoss_gz_plugins/plugins"

    # --- 车辆生成与传感器 ----------------------------------------------------
    spawn_x: "-11.9"                  # 机器人初始 X 坐标，米。
    spawn_y: "-4.4"                   # 机器人初始 Y 坐标，米。
    spawn_z: "0.25"                   # 机器人初始 Z 坐标，米。
    spawn_yaw_deg: "0"                # 初始朝向，角度；launch 转为弧度交给 Gazebo。
    spawn_rendering_sensors: "True"   # 是否生成 GPU 雷达和相机。
    contact_diagnostics: "False"      # 是否打开模型接触诊断。
    drive_model: "pi"                 # 底盘驱动实现：legacy 或 pi。

    # --- ROS 节点与底盘适配 --------------------------------------------------
    use_sim_time: true                 # 节点是否使用仿真 /clock。
    robot_state_publish_frequency: 100.0  # robot_state_publisher 的 TF 发布频率，Hz。
    bridge_config_file: "pb_ros_gz_bridge.yaml"  # ROS/Gazebo 话题桥接规则文件，位于本包 config/。
    truth_topic: "/pb_sim/chassis_truth"  # 同一仿真步的底盘真值里程计输入。
    health_topic: "/pb/truth_health" # 真值适配器健康状态输出。
    control_source: "meshnav"         # 底盘速度来源；复用仿真时也切换到此值。
    hold_enabled: true                # 导航指令停止时是否启用底盘闭环驻停。
    hold_pose_topic: "/odom"         # 驻停控制读取的位姿话题。
    hold_gain: 1.0                    # 驻停位置误差的比例增益。
    hold_max_linear_velocity: 0.1     # 驻停最大线速度，米/秒。
    hold_max_angular_velocity: 0.2    # 驻停最大角速度，弧度/秒。
    hold_angular_deadband: 0.02       # 驻停角度误差死区，弧度。
    base_to_chassis_xyz: [0.0, 0.0, 0.076]   # base_footprint 到 chassis 的平移，米。
    base_to_chassis_xyzw: [0.0, 0.0, 0.0, 1.0]  # 同一变换的四元数 [x,y,z,w]。

    # --- 车体几何 ------------------------------------------------------------
    collision_aabb_min: [-0.2828, -0.216607, 0.000198]  # base_footprint 中碰撞包围盒最小角，米。
    collision_aabb_max: [0.2828, 0.216607, 0.226]       # 同一包围盒最大角，米。
    # 包围盒来自 pb_vehicle_adapter.robot_envelope；模型修改后需重新生成。
