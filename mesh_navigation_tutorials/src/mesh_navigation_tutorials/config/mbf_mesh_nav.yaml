# =============================================================================
# MeshNav 地图与规划参数（mesh_navigation_tutorials 树）
# =============================================================================
#
# 【先分清两类参数——这是最容易踩错的地方】
#
#   A. 运行时参数（本文件）：决定"在一张已有的可通行曲面上，哪里贵、哪里致命"。
#      改完必须让 .h5 缓存失效重算，见下面《缓存失效规则》。
#
#   B. 建图参数（不在本文件里）：决定"哪些面算可通行"——最大坡面角度、净空高度、
#      网格分辨率。这些在生成 PLY 时就已经烧进几何里了，运行时**无法**调整，
#      只能重建 PLY：
#          field/build_multilevel_nav_mesh.py
#              --grid-m 0.05            # 网格分辨率
#              --max-slope-deg 55.0     # ← 可通行坡面角度
#              --robot-height-m 0.225   # ← 净空
#              --hit-merge-m 0.012
#      已烧进当前地图的值记录在：
#          field/converted_rmuc2026/mesh_planner/rmuc2026_field.multilevel.json
#          (max_slope_deg=55.0, robot_height_m=0.225, nonmanifold_edges=0)
#      ⚠ 55° 是刻意选的：RMUC 两道坡各有 52.5° 的过渡带，把上限收到 50° 或 35°
#        会把这条过渡带整段抹掉，坡就断了。**不要为了"更保守"而下调它。**
#
# 【缓存失效规则】以下任一变化后，旧的 <map>.h5 必须删除并重算，否则你会拿到
# 一张与新参数不匹配的层缓存，表现为"改了参数但行为没变"：
#       - PLY 的顶点 / 三角形 / 坐标变化
#       - 本文件里任何 MeshLayer 参数变化
#       - MeshMap / HDF5 格式实现变化
#    操作（注意 h5 路径是相对启动时 CWD 的）：
#       cd /home/rainple/nav_test/mesh_navigation_tutorials
#       mv rmuc2026_field.h5 rmuc2026_field.h5.bak.$(date +%Y%m%d-%H%M%S)
#       ros2 launch ... world_name:=rmuc2026_field  # 首启从 PLY 重算
#       ros2 service call /move_base_flex/save_map std_srvs/srv/Trigger "{}"
#
# 【footprint 只通过膨胀层进入规划】MeshNav 没有"车体"这个概念，它把车近似成一个
#   **无方向的圆盘**：
#       inscribed_radius = 圆盘半径（贴到致命顶点就判死）
#   对长方体 footprint，应取**内切半径 = 半宽**，不是外接半径。参考值
#   （config/pb_vehicle_profile.yaml，本车 0.5656 × 0.4332 m）：
#       static_inscribed_radius = 0.216608   # 内切 = 半宽
#       （外接半径为 0.356223，用它会把 0.4 m 宽的通道全判死）
# =============================================================================

move_base_flex:
  ros__parameters:
    # ---- 坐标系与里程计 -----------------------------------------------------
    global_frame: 'map'          # 全局坐标系。RViz 点的目标坐标就在这个系里；
                                 # 换掉它，所有目标坐标的含义都会跟着变。
    robot_frame: 'base_footprint'  # 车体坐标系（贴地投影）。规划器用它查询机器人位姿。
    odom_topic: 'odom'           # 里程计话题；MBF 由它拿机器人速度（速度长期为 0 会
                                 # 触发下面的 cmd_vel_ignored_tolerance）。

    # ---- 时间与到达前后行为 -------------------------------------------------
    use_sim_time: true           # 仿真：时间来自 /clock。真机必须为 false。
    force_stop_at_goal: true     # 到达后由 MBF 发零速度。注意：**零速度不等于有制动力**，
                                 # 力控底盘在零指令下仍会滑（本项目实测驻停漂移 1.77 m），
                                 # 需要独立的保持层来接管。
    force_stop_on_cancel: true   # 取消时同样发零速度。

    # ---- 全局规划器（在网格上按边权找最小代价曲线）--------------------------
    planners: ['mesh_planner']
    mesh_planner:
      type: 'cvp_mesh_planner/CVPMeshPlanner'
      # type: 'dijkstra_mesh_planner/DijkstraMeshPlanner'
      cost_limit: 0.99           # 【关键联动】顶点代价高于此值即被避开。
                                 # 必须**小于** static_inflation.inscribed_value，
                                 # 否则膨胀层内圈（已判为靠近障碍）也会被当作可通行，
                                 # 规划器会贴着障碍甚至穿过去。当前 0.99 < 1.0，安全。
      publish_vector_field: true # 把整张向量场可视化出来。注意真正被控制器跟踪的
                                 # 是这张场，不是报告出来的那条路径。

    planner_patience: 10.0       # 单次全局规划的超时 [s]，超时后按 max_retries 重试。
    planner_max_retries: 2       # 规划失败重试次数。
    project_path_onto_mesh: false  # 是否把路径投影回网格。false：直接用规划器输出。

    # ---- 局部控制器（把"往哪走"变成速度指令）--------------------------------
    controllers: ['mesh_controller']
    # controllers: ['pb_terminal_controller']
    mesh_controller:
      type: 'mesh_controller/MeshController'
      ang_vel_factor: 7.0        # 角速度增益倍率。太小会出现"场方向偏了但转不过去"的
                                 # 纯旋转卡死（本项目 -Y 曾因此失败）。
      lin_vel_factor: 1.0        # 线速度增益倍率。
      holonomic: true
      # 注意：这个类还有两个决定底盘类型的关键参数，本文件没写 → 用类默认值：
      #   holonomic   = false   # false=按非完整底盘（只能前进+转向）处理：
      #                         #   当向量场与车头夹角 > max_angle 时线速度强制为 0，
      #                         #   只能原地转。完整底盘（mecanum/omni）应设为 true。
      #   max_angle   = 20.0    # 上面那个夹角阈值 [°]。
      # 本车是 mecanum 却用默认的 false，等于放弃横移能力——若出现"只转不走"，
      # 先查这里。

    controller_patience: 2.0     # 单次控制步超时 [s]。
    controller_max_retries: 4    # 控制失败重试次数。
    dist_tolerance: 0.2          # 到达判据：与目标的位置误差容差 [m]。
    angle_tolerance: 6.3         # 到达判据：与目标的航向误差容差 [rad]。
    cmd_vel_ignored_tolerance: 10.0
                                 # 机器人连续"忽略速度指令"多久后放弃 [s]。
                                 # 卡住场景（指令非零但车身不动）就是靠它最终 ABORT，
                                 # 调小能更快失败退出，但治标不治本。

    mesh_map:
      # ---- 输入与缓存 -------------------------------------------------------
      # In this examples, `mesh_file` is set dynamically from the launch file.
      # you can also set it statically:
      # mesh_file: '.../parking_garage.ply'
      #   ↑ 可通行曲面（三角形网格）的输入路径。由 launch 动态设置成
      #     <share>/maps/<map_name>.ply。
      mesh_part: '/'
      #   ↑ 在 HDF5/PLY 里的根部分组名。PLY 用 '/' 表示根。
      # storage
      # mesh_working_file: 'parking_garage.h5'
      #   ↑ 工作缓存：网格 + 各层算出来的逐顶点/逐边代价。由 launch 设为
      #     "<map_name>.h5"（**相对 CWD**）。它只是缓存，不是源地图；
      #     参数或 PLY 一变就必须重算（见文件头《缓存失效规则》）。
      mesh_working_part: 'mesh'
      #   ↑ 写入 HDF5 时使用的网格名。

      # ---- 层图：哪些层参与，以及用哪一层做规划 ------------------------------
      # 处理顺序即下面的列表顺序：前面的层被后面的层当输入。
      layers:
        - border              # 网格边界
        - height_diff         # 相邻高度差（台阶/落差）
        - roughness           # 局部粗糙度
        - static_combination  # 把上面三层线性合成
        - static_inflation    # 对合成结果做膨胀
        - obstacle            # 实时障碍点
        - obstacle_inflation  # 对实时障碍做膨胀
        - final               # 取 static/obstacle 两者代价的最大值

      default_layer: 'final'
      #   ↑ 规划与控制实际使用的层。改成 'static_*' 就只用静态地图、忽略实时障碍。

      # ---- 各层的具体参数 ---------------------------------------------------
      height_diff:
        type: 'mesh_layers/HeightDiffLayer'
        combination_weight: 1.0
        #   ↑ 参与 static_combination 线性合成时的权重：
        #     vertex_cost = Σ (combination_weight × 该层 vertex_cost)
        threshold: 0.1
        #   ↑ 【可通行性直接相关】相邻顶点高度差超过此值 [m] 即标为**致命**，
        #     即"台阶/落差超过 0.2 m 的地方不可通行"。调小=更保守（小台阶也挡），
        #     调大=允许更大落差。注意这**不是**坡度阈值，坡度在建图侧。
        # 本文件未设置 radius：计算高度差时用的邻域半径（用类默认值）。
        # 想控制"多大范围内的落差才算台阶"，可以显式加 radius: <m>。

      border:
        type: 'mesh_layers/BorderLayer'
        combination_weight: 1.0
        border_cost: 1.0
        #   ↑ 赋给网格边界顶点的代价。
        threshold: 0.2
        #   ↑ 边界代价超过此值即判致命。当前 1.0 > 0.2 ⇒ **网格边界一律不可通行**，
        #     作用是防止规划器把车带到地图边缘外。改小 border_cost 会让边缘变可走
        #     （危险），改大 threshold 则等于关掉这条保护。

      roughness:
        type: 'mesh_layers/RoughnessLayer'
        combination_weight: 0.3
        threshold: 1.0
        #   ↑ 局部粗糙度超过此值即判致命。粗糙度反映"这块面起伏多大"，
        #     用来挡碎石/不平地面。调小=只走平整面。
        # 同样未设置 radius（计算粗糙度的邻域半径，用类默认值）。

      static_combination:
        # This layer combines the three input layers by linearly combining vertex costs:
        # -> vertex_cost = layer1.combination_weight * layer1.vertex_cost + layer2.combination_weight * layer2.vertex_cost + ...
        # The input layers' lethal vertices are accumulated in a combined set
        type: 'mesh_layers/AvgCombinationLayer'
        # The `inputs` parameter determines which layers are processed by this layer.
        # If a layer does not process inputs, this parameter can be omitted
        inputs: ['height_diff', 'border', 'roughness']
        #   ↑ 汇总上面三层的代价（线性加权）与致命顶点（取并集）。

      static_inflation:
        # 【膨胀层——车体尺寸唯一的入口】
        type: 'mesh_layers/InflationLayer'
        inputs: ['static_combination']
        combination_weight: 1.0
        inflation_radius: 1.0
        #   ↑ **外圈**半径 [m]：距离致命顶点超过此值就不再产生任何代价。
        #     决定"障碍的影响范围有多大"——只影响代价高低，不决定能否通过。
        inscribed_radius: 0.15
        #   ↑ **内圈**半径 [m]：贴到致命顶点这么近就取"内圈代价"（见下），
        #     等价于判死。**这才是决定窄通道能否通过的那个参数**，
        #     应取车体 footprint 的**内切半径（半宽）**。
        #     ⚠ 当前 0.4 是按教程大车设的；本车 0.5656×0.4332 m 的内切半径是
        #       0.216608 m，用 0.4 会让窄处过度判死（通道需 > 0.8 m 才可过）。
        lethal_value: .inf
        #   ↑ 致命顶点自身的代价（由输入层传下来的 lethals）。
        inscribed_value: 1.0
        #   ↑ 内圈饱和代价。**必须大于 mesh_planner.cost_limit**，否则内圈被当可通行。
        repulsive_field: false
        #   ↑ 是否改用"斥力场"式代价分布（远离障碍时代价单调下降的另一套形状）。
        #     false=指数衰减，一般够用。
        cost_scaling_factor: 2.2
        #   ↑ 两圈之间代价的指数衰减速率。实际公式（inflation_layer.cpp）：
        #       inscribed_radius < d ≤ inflation_radius 时
        #           cost = inscribed_value × exp(−cost_scaling_factor × (d − inscribed_radius))
        #       d > inflation_radius 时 cost = 0
        #     调大 ⇒ 代价随距离下降更快、"怕障碍"的区域更薄（更贴墙走）；
        #     调小 ⇒ 整片区域都保持较高代价（更居中走）。

      obstacle:
        # 【实时障碍层】由传感器点云动态更新；静态地图没有的障碍靠它避开。
        type: 'mesh_layers/ObstacleLayer'
        combination_weight: 1.0
        robot_height: 0.23
        #   ↑ 车体高度 [m]：高于它的点云被当作"可以从下面穿过"而忽略，
        #     低于它的才算障碍。**必须按真实车高设**。
        #     ⚠ 当前 0.7 是教程车（含桅杆）的值；本车碰撞高度只有 0.215 m。
        #       设 0.7 会把 0.246 m 高的隧道顶板全部当成障碍 → 隧道直接不可通行。
        #       本车应设 ≈ 0.23（pb_vehicle_profile.yaml 的值）。
        max_obstacle_dist: 10.0
        #   ↑ 只考虑这个距离 [m] 内的障碍点，防止远处噪声拖慢更新。
        topic: 'obstacle_points'
        #   ↑ 实时障碍点云（sensor_msgs/PointCloud2）的输入话题。
        #     没有点云时该层不产生任何障碍——静态地图仍可用。

      obstacle_inflation:
        # 与 static_inflation 完全同理，只是作用在实时障碍上。
        type: 'mesh_layers/InflationLayer'
        inputs: ['obstacle']
        combination_weight: 1.0
        inflation_radius: 1.5      # 外圈，同 static_inflation
        inscribed_radius: 0.2      # 内圈，同 static_inflation（车体尺寸）
        lethal_value: .inf
        inscribed_value: 1.0
        repulsive_field: false
        cost_scaling_factor: 2.0

      final:
        # 取静态与动态两张代价图里较大的那个，避免动态障碍被静态代价"稀释"。
        type: 'mesh_layers/MaxCombinationLayer'
        inputs: ['static_inflation', 'obstacle_inflation']

      # An edge cost equals the total costs that are collected along a
      # triangle's edge by linearly interpolating the combined vertex costs
      # This factor defines the factor that is used for the final edge weight
      # -> edge_weight = edge_length + edge_cost_factor * edge_cost
      # This edge_weight is then passed to the global planner to search for
      # the best path
      # Note: Set this to 0.0 if you need the shortest path
      edge_cost_factor: 5.0
      #   ↑ 代价相对几何长度在寻路中的权重：
      #       edge_weight = edge_length + edge_cost_factor × edge_cost
      #     0.0 = 纯最短路径（贴着障碍抄近路，可能危险）；
      #     越大 = 越愿意绕远以避开高代价区域。
      #     ⚠ 这是"路径形状"的主要旋钮；它不影响能否通过，只影响绕不绕。

      # debug function: enable this, for publishing text markers with edge costs
      publish_edge_weights_text: false
      #   ↑ 调试：把每条边的代价以文字 Marker 发出来（RViz 可见）。会明显增加流量。

      # debug/development function: enable this to log the update times of changing layers to a csv file
      enable_layer_timer: false
      #   ↑ 调试：把各层更新时间写 CSV，用于定位"哪一层卡住启动/更新"。
