# RMUC2026 短坡通道约束配置（阶段 2：最小可行修复）。
#
# 坐标单位：米，与 map 帧一致（即场地碰撞 STL 的世界坐标，ground_truth 定位
# 直接发布 map -> base_footprint）。
#
# 本文件只定义几何与行为参数；总开关由 launch 的
# `mesh_controller.ramp_corridors_enabled` 控制，仅对 rmuc2026_field 置 true，
# 其余地图保持关闭，不改变其行为。
#
# 注意：本文件被 mbf_mesh_nav 作为参数文件加载到 `move_base_flex` 节点，
# 而控制器插件把参数声明在 `mesh_controller.*` 命名空间下，因此顶层必须是
# `move_base_flex`，再套 `ros__parameters` 和 `mesh_controller`。
#
# 中心线依据 2026-09-07 的碰撞 STL 采样确定：
#   坡道条带横向约 y ∈ [5.55, 6.40]，两侧是更高结构（y≈5.55 处 z≈0.36，
#   y≈6.40 处更高）；横向中心即 y≈5.95。
#   纵向：低平台 x ∈ [-0.75, -0.2]（z≈0.00~0.02），坡面 x ∈ [-0.2, 0.8]
#   （z 0.02 -> 0.203），高平台 x >= 0.8（z≈0.203）。
move_base_flex:
  ros__parameters:
    mesh_controller:
      ramp_corridors: ['rmuc2026_short_ramp']
      rmuc2026_short_ramp:
        frame_id: 'map'
        # 入口 (-0.7, 5.95) 位于低平台，出口 (0.9, 5.95) 位于高平台。
        centerline:
          [-0.7, 5.95, 0.005,
           -0.5, 5.95, 0.005,
           -0.3, 5.95, 0.008,
           -0.1, 5.95, 0.045,
            0.1, 5.95, 0.082,
            0.3, 5.95, 0.123,
            0.5, 5.95, 0.163,
            0.7, 5.95, 0.193,
            0.9, 5.95, 0.203]
        half_width: 0.275      # 通道半宽（用于判定是否在通道内与可视化）
        min_height: -0.05      # 仅在该高度带内触发；排除邻侧高台与隧道顶
        max_height: 0.30
        max_speed: 0.10        # 上坡限速 (m/s)
        approach_speed: 0.10   # 入口前接近速度 (m/s)
        align_dist: 0.5        # 入口前多远开始对中/对向 (m)
        align_lat_tol: 0.02    # 进入前允许的横向误差 (m)
        align_yaw_tol_deg: 5.0 # 进入前允许的航向误差 (deg)
        align_hold_s: 0.3      # 对中/对向需保持的时间 (s)
        exit_dist: 0.3         # 越过出口多远后交还常规控制 (m)
        k_lat: 1.5             # 横向误差 -> 横向速度增益 (1/s)
        k_yaw: 1.5             # 航向误差 -> 偏航角速度增益 (1/s)
