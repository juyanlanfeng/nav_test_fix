d1_controller:
  ros__parameters:
    # Ceres is centred on base_link; the production Odin robot uses an offset.
    robot_center_offset_frame: base_link
    robot_center_offset_x: 0.0
    robot_center_offset_y: 0.0
    robot_center_offset_z: 0.0

    control_frequency: 20.0
    lookahead_distance: 0.20
    tracking_point_reached_xy_tolerance: 0.40
    tracking_point_marker_scale: 0.28

    # Keep the OpenCV window disabled in Gazebo/headless runs.
    enable_tracking_debug_view: false
    tracking_debug_view_size_px: 640
    tracking_debug_view_pixels_per_meter: 80.0
    tracking_debug_view_frequency: 10.0

    linear_gain: 1.0
    lateral_gain: 0.8
    heading_gain: 0.8
    cross_track_angular_gain: 0.5
    final_yaw_gain: 0.3

    enable_lateral_motion: true
    max_linear_speed: 0.7
    max_lateral_speed: 0.5
    max_angular_speed: 0.9

    # No final-yaw alignment for the low-clearance vehicle.  `align_final_yaw:
    # true` with a goal heading of 180 deg makes the controller treat the heading
    # error as +355 deg, so it spins ~130 deg while standing at the tunnel mouth,
    # where the 4-7 cm base plate of the tunnel wall leaves no room: the first
    # negative-Y JIE run ended with a front wheel on that plate
    # (field/check_trajectory_clearance.py).  The tunnel acceptance is positional -
    # the vehicle crosses the corridor nose-first and stops, exactly like the
    # manual drives in log/accept_low_vehicle_tunnel.sh.
    align_final_yaw: false
    linear_deadband: 0.05
    lateral_deadband: 0.05
    angular_deadband: 0.05
    goal_position_tolerance: 0.1
    goal_yaw_tolerance: 0.2
