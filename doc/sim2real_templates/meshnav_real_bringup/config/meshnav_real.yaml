# Standalone real navigation configuration, derived from the upstream
# BSD-3-Clause tutorial configuration; see THIRD_PARTY_NOTICES.md.
# No tutorial/PB package is loaded at runtime. robot.yaml supplies measured
# envelope, offsets, range/FOV, limits, map assets and cache paths.
# Read every fixed parameter (including static costs/controller gains) before
# commissioning; these fixed values are a starting profile, not an acceptance.
move_base_flex:
  ros__parameters:
    global_frame: map
    odom_frame: odom
    robot_frame: base_footprint
    odom_topic: /odom
    use_sim_time: false
    force_stop_at_goal: true
    force_stop_on_cancel: true
    planners:
    - mesh_planner
    mesh_planner:
      type: cvp_mesh_planner/CVPMeshPlanner
      step_width: 0.1
      cost_limit: 0.99
      publish_vector_field: true
    planner_patience: 10.0
    planner_max_retries: 10
    project_path_onto_mesh: false
    planner_frequency: 2.0
    path_check_step: 0.025
    path_check_max_distance: 0.4
    controller_frequency: 20.0
    controllers:
    - mesh_controller
    mesh_controller:
      type: mesh_controller/MeshController
      holonomic: true
      lin_vel_factor: 1.0
      ang_vel_factor: 7.0
      max_lin_velocity: 0.15
      max_ang_velocity: 0.2
      arrival_fading: 0.5
    controller_patience: 2.0
    controller_max_retries: 4
    dist_tolerance: 0.2
    angle_tolerance: 0.2
    cmd_vel_ignored_tolerance: 2.0
    mesh_map:
      mesh_file: ''
      mesh_part: /
      mesh_working_file: ''
      mesh_working_part: mesh
      layers:
      - border
      - height_diff
      - roughness
      - static_combination
      - static_inflation
      - obstacle
      - obstacle_inflation
      - final
      default_layer: final
      height_diff:
        type: mesh_layers/HeightDiffLayer
        combination_weight: 1.0
        threshold: 0.1
      border:
        type: mesh_layers/BorderLayer
        combination_weight: 1.0
        border_cost: 1.0
        threshold: 0.2
      roughness:
        type: mesh_layers/RoughnessLayer
        combination_weight: 0.3
        threshold: 1.0
      static_combination:
        type: mesh_layers/AvgCombinationLayer
        inputs:
        - height_diff
        - border
        - roughness
      static_inflation:
        type: mesh_layers/InflationLayer
        inputs:
        - static_combination
        combination_weight: 1.0
        inflation_radius: null
        inscribed_radius: null
        lethal_value: .inf
        inscribed_value: 1.0
        repulsive_field: false
        cost_scaling_factor: 2.2
      obstacle:
        type: mesh_layers/TemporalObstacleLayer
        topic: /dynamic_obstacles
        qos: Reliable
        tf_tolerance: 0.1
        down_axis:
        - 0.0
        - 0.0
        - -1.0
        axis_frame: map
        combination_weight: 1.0
        robot_height: null
        max_obstacle_dist: null
        history_voxel_size: 0.05
        clearing_mode: stvl
        decay_model: 0
        obstacle_keep_time: null
        decay_acceleration: 0.0
        max_observation_age: 0.3
        sensor_frame: lidar_link
        sensor_offset_xyz:
        - 0.0
        - 0.0
        - 0.0
        min_sensor_range: null
        horizontal_fov_deg: null
        vertical_fov_min_deg: null
        vertical_fov_max_deg: null
        localization_reference_frame: odom
        pose_jump_translation: 0.75
        pose_jump_rotation_deg: 45.0
        pose_jump_max_interval: 0.2
      obstacle_inflation:
        type: mesh_layers/InflationLayer
        inputs:
        - obstacle
        combination_weight: 1.0
        inflation_radius: null
        inscribed_radius: null
        lethal_value: .inf
        inscribed_value: 1.0
        repulsive_field: false
        cost_scaling_factor: 2.5
      final:
        type: mesh_layers/MaxCombinationLayer
        inputs:
        - static_inflation
        - obstacle_inflation
      edge_cost_factor: 5.0
      publish_edge_weights_text: false
      enable_layer_timer: false
