# Copy this directory into an external bundle; fill null values from measurements.
# These files are templates. The launch rejects them until assets and values pass
# validation. Changing a true/false flag does not perform a calibration or test.
schema_version: 1
deployment_kind: hardware
integration:
  pcl_source_patch_verified: false
  background_alignment_verified: false
  localization_verified: false
  tf_ownership_verified: false
robot:
  length_m: null
  width_m: null
  height_m: null
  collision_radius_m: null
  safety_margin_m: null
  height_diff_threshold_m: null
  holonomic: true
frames:
  map: map
  odom: odom
  base: base_footprint
  lidar: lidar_link
sensors:
  # Link -> measurement origin correction; keep zero when TF names the origin.
  offset_xyz: [0.0, 0.0, 0.0]
  min_range_m: null
  max_range_m: null
  horizontal_fov_deg: null
  # TemporalObstacleLayer requires elevation limits strictly inside (-90, 90).
  vertical_fov_min_deg: null
  vertical_fov_max_deg: null
perception:
  distance_threshold_m: null
  self_filter_radius_m: null
  obstacle_projection_height_m: null
  obstacle_keep_time_s: null
  max_observation_age_s: 0.30
  # Keep <= 0.001; TemporalObstacleLayer's future tolerance is fixed at 1 ms.
  max_future_s: 0.001
  # Both soft radii must be >= collision_radius_m + safety_margin_m.
  static_inflation_radius_m: null
  dynamic_inflation_radius_m: null
motion:
  max_linear_velocity: 0.15
  max_angular_velocity: 0.20
  max_linear_acceleration: 0.30
  max_angular_acceleration: 0.50
map:
  # Relative to this external bundle, not to the code or the current directory.
  mesh_file: maps/site_nav.ply
  background_file: maps/site_background.pcd
  version: site01_v1
  # Populate with `sha256sum maps/site_nav.ply maps/site_background.pcd`.
  mesh_sha256: ""
  background_sha256: ""
