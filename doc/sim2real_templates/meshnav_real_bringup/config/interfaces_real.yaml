meshnav_navigator:
  ros__parameters:
    use_sim_time: false
    goal_topic: /rviz/goal_pose
    planner: mesh_planner
    controller: mesh_controller
    planner_frequency: 2.0
    get_path_action: /move_base_flex/get_path
    exe_path_action: /move_base_flex/exe_path
    check_path_service: /move_base_flex/check_path_cost
    pose_timeout: 2.0
    path_progress_window: 2.0
    action_timeout: 15.0
    replan_patience: 15.0
    replan_retry_period: 0.5
command_gateway:
  ros__parameters:
    use_sim_time: false
    input_topic: /nav/cmd_vel
    # Hardware output accepts geometry_msgs/Twist. An existing chassis arbiter
    # may own the motor topic; in that case point this at its navigation input.
    output_topic: /hardware/cmd_vel
    odom_topic: /odom
    cloud_topic: /cloud
    obstacle_topic: /dynamic_obstacles
    hardware_ready_topic: /hardware/ready
    estop_topic: /hardware/estop
    localization_health_topic: /localization/healthy
    cloud_qos: best_effort
    # MBF uses a Reliable odometry subscription. A BestEffort driver needs the
    # hardware-side normalization adapter to republish the normalized /odom.
    odom_qos: reliable
    obstacle_qos: reliable
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    lidar_frame: lidar_link
    publish_frequency_hz: 20.0
    command_timeout_s: 0.25
    data_timeout_s: 0.50
    max_data_age_s: 0.30
    health_timeout_s: 0.50
    tf_timeout_s: 0.50
    max_future_s: 0.001
    # Launch replaces these with robot.yaml motion limits. Gateway startup is
    # hardcoded disabled; no YAML option can auto-enable the real chassis.
    max_linear_velocity: 0.15
    max_angular_velocity: 0.20
    max_linear_acceleration: 0.30
    max_angular_acceleration: 0.50
